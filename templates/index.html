
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de cáncer</title>

    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172b4d;
            background: #eff6ff;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            --azul: #2563eb;
            --azul-oscuro: #1d4ed8;
            --borde: #dbe5f2;
            --texto-suave: #5b6b82;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(16px, 4vw, 48px);
            background:
                radial-gradient(ellipse at top left, #dbeafe 0, transparent 42%),
                linear-gradient(135deg, #f8fbff, #edf4ff);
        }

        main {
            position: relative;
            max-width: 1080px;
            margin: 0 auto;
            padding: clamp(24px, 5vw, 48px);
            overflow: hidden;
            background: #fff;
            border: 1px solid #e5edf8;
            border-radius: 22px;
            box-shadow: 0 24px 70px #17376316;
        }

        main::before {
            position: absolute;
            inset: 0 0 auto;
            height: 6px;
            background: linear-gradient(90deg, #2563eb, #60a5fa, #38bdf8);
            content: "";
        }

        h1 {
            margin: 0;
            color: #163b73;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            letter-spacing: -0.04em;
        }

        main > p {
            max-width: 720px;
            margin: 12px 0 30px;
            color: var(--texto-suave);
            font-size: 1rem;
            line-height: 1.7;
        }

        #campos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr));
            gap: 16px;
        }

        #campos label {
            display: block;
            padding: 14px;
            color: #334b6c;
            background: #f8faff;
            border: 1px solid var(--borde);
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 650;
            overflow-wrap: anywhere;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        #campos label:focus-within {
            background: #fff;
            border-color: #7aa7f8;
            box-shadow: 0 0 0 4px #2563eb18;
        }

        #campos input {
            width: 100%;
            min-height: 44px;
            margin-top: 9px;
            padding: 10px 12px;
            color: #172b4d;
            background: #fff;
            border: 1px solid #d4deeb;
            border-radius: 8px;
            font: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        #campos input::placeholder {
            color: #9aa9bd;
            font-weight: 400;
        }

        #campos input:focus {
            border-color: var(--azul);
            box-shadow: 0 0 0 3px #2563eb1c;
        }

        button {
            min-height: 48px;
            margin-top: 24px;
            padding: 12px 22px;
            color: #fff;
            background: var(--azul);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 8px 18px #2563eb30;
            transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            background: var(--azul-oscuro);
            box-shadow: 0 10px 22px #2563eb3d;
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            box-shadow: none;
            transform: none;
        }

        #resultado {
            margin-top: 24px;
            padding: 18px 20px;
            color: #214b85;
            background: #eff6ff;
            border: 1px solid #d6e7ff;
            border-radius: 12px;
            white-space: pre-line;
            line-height: 1.65;
        }

        #resultado.benigno {
            background: #dcfce7;
            color: #166534;
            border-color: #bbf7d0;
        }

        #resultado.maligno {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        #resultado.error {
            background: #fef3c7;
            color: #92400e;
            border-color: #fde68a;
        }

        @media (max-width: 520px) {
            main {
                border-radius: 16px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<main>
    <h1>Predicción de cáncer</h1>

    <p>
        Introduce los 30 valores de las características del dataset para obtener
        una estimación del modelo sobre si el caso es maligno o benigno.
    </p>

    <form id="formulario">
        <div id="campos">Cargando características...</div>
        <button id="botonPredecir" type="submit" disabled>
            Realizar predicción
        </button>
    </form>

    <div id="resultado" role="status" aria-live="polite">
        Conectando con la API...
    </div>
</main>

<script>
    const campos = document.getElementById("campos");
    const resultado = document.getElementById("resultado");
    const formulario = document.getElementById("formulario");
    const boton = document.getElementById("botonPredecir");

    function mostrarMensaje(mensaje, clase = "") {
        resultado.className = clase;
        resultado.textContent = mensaje;
    }

    async function cargarCampos() {
        boton.disabled = true;

        try {
            const respuesta = await fetch("/api/caracteristicas");

            if (!respuesta.ok) {
                throw new Error(
                    `Error HTTP ${respuesta.status} al cargar las características.`
                );
            }

            const datos = await respuesta.json();

            if (!Array.isArray(datos.caracteristicas) ||
                datos.caracteristicas.length !== 30) {
                throw new Error(
                    "La API no devolvió exactamente 30 características."
                );
            }

            campos.replaceChildren();

            datos.caracteristicas.forEach((nombre, indice) => {
                const etiqueta = document.createElement("label");
                etiqueta.textContent = `${indice + 1}. ${nombre}`;

                const input = document.createElement("input");
                input.type = "number";
                input.step = "any";
                input.required = true;
                input.name = `valor_${indice}`;
                input.id = `valor_${indice}`;
                input.placeholder = "Introduce un valor";

                etiqueta.appendChild(input);
                campos.appendChild(etiqueta);
            });

            boton.disabled = false;

            mostrarMensaje(
                "Se cargaron correctamente las 30 características. Completa los campos para continuar."
            );

            console.log("Características cargadas:", datos.caracteristicas);

        } catch (error) {
            mostrarMensaje(
                "No se pudieron cargar las características.\n" +
                error.message +
                "\nComprueba que Flask esté ejecutándose y revisa la consola.",
                "error"
            );

            console.error("Error al cargar características:", error);
        }
    }

    formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const entradas = campos.querySelectorAll("input");

        if (entradas.length !== 30) {
            mostrarMensaje(
                "No se han cargado correctamente las 30 características.",
                "error"
            );
            return;
        }

        const valores = [];

        for (const entrada of entradas) {
            if (entrada.value.trim() === "") {
                mostrarMensaje("Completa todos los campos.", "error");
                entrada.focus();
                return;
            }

            const numero = Number(entrada.value);

            if (!Number.isFinite(numero)) {
                mostrarMensaje(
                    "Introduce únicamente valores numéricos válidos.",
                    "error"
                );
                entrada.focus();
                return;
            }

            valores.push(numero);
        }

        boton.disabled = true;
        mostrarMensaje("Procesando predicción...");

        try {
            const respuesta = await fetch("/api/predecir", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ valores })
            });

            const datos = await respuesta.json();

            if (!respuesta.ok) {
                throw new Error(
                    datos.error || `Error HTTP ${respuesta.status}.`
                );
            }

            
const claseResultado =
    (datos.resultado || "").toLowerCase() === "benigno"
        ? "benigno"
        : "maligno";

mostrarMensaje(
    `Resultado del modelo: ${datos.resultado}\n` +
    `Código de clase: ${datos.prediccion}\n` +
    `Probabilidad estimada de malignidad: ${datos.probabilidad_maligno}%\n` +
    `Probabilidad estimada de benignidad: ${datos.probabilidad_benigno}%\n` +
    `Exactitud de prueba: ${(datos.exactitud_prueba * 100).toFixed(2)}%\n\n` +
    datos.mensaje,
    claseResultado
);


        } catch (error) {
            mostrarMensaje(
                "Error al realizar la predicción:\n" + error.message,
                "error"
            );

            console.error("Error en la predicción:", error);

        } finally {
            boton.disabled = false;
        }
    });

    cargarCampos();
</script>
</body>
</html>
